<!-- The "Viewer" page of the settings dialog: a monitor in the style of Breeze (designed with Codex). -->
<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="frame" x1="0" y1="3" x2="0" y2="25" gradientUnits="userSpaceOnUse">
      <stop stop-color="#566069"/>
      <stop offset="1" stop-color="#31363b"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="6" x2="0" y2="21" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7cbcec"/>
      <stop offset="1" stop-color="#c6ecf7"/>
    </linearGradient>
    <linearGradient id="stand" x1="0" y1="25" x2="0" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0e5e7"/>
      <stop offset="1" stop-color="#99a1a7"/>
    </linearGradient>
    <linearGradient id="shade" x1="5" y1="7" x2="26" y2="22" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="screenClip">
      <rect x="5" y="6" width="22" height="15" rx="1"/>
    </clipPath>
  </defs>

  <!-- Breeze-style soft cast shadow -->
  <path d="M4 4h24l2 2v18l-7 7H11l-8-8V5z" fill="#292c2f" opacity=".18"/>

  <!-- television / monitor body -->
  <rect x="2" y="3" width="28" height="22" rx="2" fill="url(#frame)"/>
  <path d="M4 3h24a2 2 0 0 1 2 2v1H2V5a2 2 0 0 1 2-2z" fill="#6b747c" opacity=".55"/>
  <rect x="4" y="5" width="24" height="18" rx="1" fill="#232629"/>

  <!-- image on the screen -->
  <g clip-path="url(#screenClip)">
    <rect x="5" y="6" width="22" height="15" fill="url(#sky)"/>
    <circle cx="22.5" cy="10.5" r="2.5" fill="#fdbc4b"/>
    <path d="M4 20l7-7 5 5 3-3 9 7H4z" fill="#7aabdc"/>
    <path d="M12 21l7-7 10 8H12z" fill="#3daee9"/>
    <path d="M4 20l7-7 2 2-2 2 2 1-3 3z" fill="#eff0f1" opacity=".9"/>
    <path d="M4 19l7-2 5 2 5-2 8 3v3H4z" fill="#71c837"/>
    <path d="M4 21l9-3 6 3 10-2v4H4z" fill="#559b2f"/>
    <path d="M5 6h22v15H5z" fill="url(#shade)"/>
  </g>

  <!-- power light and stand -->
  <rect x="25" y="23" width="2" height="1" rx=".5" fill="#3daee9"/>
  <path d="M14 25h4v3h-4z" fill="url(#stand)"/>
  <path d="M10 28h12l2 2H8z" fill="#c6cdd1"/>
  <path d="M8 30h16v1H8z" fill="#99a1a7"/>
</svg>
